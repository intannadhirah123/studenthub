<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page information (content management: title and metadata) -->
    <title>Register | StudentHub - Student Management System</title>
    <meta name="description" content="Create a new StudentHub account.">
    <meta name="author" content="Your Name">

    <!-- Bootstrap 5.3.3 CSS (official CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Our own CSS (must come after Bootstrap) -->
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="register">

    <main class="auth-wrapper">
        <div class="card auth-card">
            <div class="card-body p-4 p-md-5">

                <!-- Logo and heading -->
                <div class="brand-logo" aria-hidden="true">🎓</div>
                <h1 class="h3 text-center fw-bold mb-1">Create Account</h1>
                <p class="text-center text-muted mb-4">Join StudentHub in a few seconds</p>

                <!-- Error / success messages appear here (filled by script.js) -->
                <div id="registerAlert" role="alert"></div>

                <!-- Register form -->
                <form id="registerForm" novalidate>
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName"
                               placeholder="e.g. Ahmad Ali" autocomplete="name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email"
                               placeholder="e.g. ahmad@example.com" autocomplete="email">
                    </div>

                    <div class="mb-3">
                        <label for="regUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="regUsername"
                               placeholder="Choose a username" autocomplete="username">
                    </div>

                    <!-- Two password boxes side by side on tablets/desktops, stacked on phones -->
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label for="regPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPassword"
                                   placeholder="Min. 6 characters" autocomplete="new-password">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword"
                                   placeholder="Repeat password" autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Already have an account? <a href="index.html" class="fw-semibold">Login here</a>
                </p>

            </div>
        </div>
    </main>

    <!-- Our JavaScript (at the end of the body) -->
    <script src="script.js"></script>
</body>
</html>
