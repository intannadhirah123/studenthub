<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page information (content management: title and metadata) -->
    <title>Login | StudentHub - Student Management System</title>
    <meta name="description" content="Log in to StudentHub, a student management system prototype for CDIM262.">
    <meta name="author" content="Your Name">

    <!-- Bootstrap 5.3.3 CSS (official CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Our own CSS (must come after Bootstrap) -->
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">

    <main class="auth-wrapper">
        <div class="card auth-card">
            <div class="card-body p-4 p-md-5">

                <!-- Logo and heading -->
                <div class="brand-logo" aria-hidden="true">🎓</div>
                <h1 class="h3 text-center fw-bold mb-1">StudentHub</h1>
                <p class="text-center text-muted mb-4">Sign in to your account</p>

                <!-- Error / success messages appear here (filled by script.js) -->
                <div id="loginAlert" role="alert"></div>

                <!-- Login form. "novalidate" lets our own JavaScript show the messages -->
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username"
                               placeholder="Enter your username" autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password"
                               placeholder="Enter your password" autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                </form>

                <!-- Link to the register page -->
                <p class="text-center mt-4 mb-3">
                    Don't have an account? <a href="register.html" class="fw-semibold">Register here</a>
                </p>

                <!-- Demo credentials, so the lecturer can test quickly -->
                <div class="alert alert-secondary small mb-0" role="note">
                    <strong>Demo login:</strong><br>
                    Username: <code>admin</code><br>
                    Password: <code>admin123</code>
                </div>

            </div>
        </div>
    </main>

    <!-- Our JavaScript (at the end of the body) -->
    <script src="script.js"></script>
</body>
</html>
